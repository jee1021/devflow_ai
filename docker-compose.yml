services:
  django:
    image: devflow_ai-django:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .envs/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    working_dir: /devflow_ai
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./:/devflow_ai/
      - static_volume:/devflow_ai/apps/static
      - media_volume:/devflow_ai/apps/media
    networks:
      - ws
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    image: devflow_ai-django:latest
    env_file:
      - ./.envs/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    working_dir: /devflow_ai
    command: celery -A config worker -l info
    volumes:
      - ./:/devflow_ai/
      - media_volume:/devflow_ai/apps/media
    networks:
      - ws
    depends_on:
      django:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
    volumes:
      - ./resources/nginx/local.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/devflow_ai/apps/static:ro
      - media_volume:/devflow_ai/apps/media:ro
    networks:
      - ws

  db:
    image: pgvector/pgvector:0.8.0-pg14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw1234
      POSTGRES_DB: devflow_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ws
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "devflow_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - ws
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  ws:
    driver: bridge

volumes:
  static_volume:
  media_volume:
  postgres_data: